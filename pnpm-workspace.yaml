packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole suite; apps use "catalog:".
catalog:
  react: ^19.2.6
  react-dom: ^19.2.6
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@types/node': ^24.12.3
  typescript: ~6.0.2
  vite: ^8.0.12
  '@vitejs/plugin-react': ^6.0.1
  vitest: ^4.1.11
  jsdom: ^29.1.1
  '@testing-library/react': ^16.3.0
  '@testing-library/jest-dom': ^6.10.0
  axe-core: ~4.13.0
  eslint: ^10.3.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.59.2
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.2
  globals: ^17.6.0
  '@supabase/supabase-js': ^2.117.3
  dompurify: ^3.4.16
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  rehype-highlight: ^7.0.2

allowBuilds:
  esbuild: true
